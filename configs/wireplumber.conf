# Only rename the UCM Speaker/Mic nodes. Matching every playback/capture PCM on
# the card also hits the SplitPCM parent (alsa_output.hw_t2-*_0) and creates a
# second DSP sink with the same name.
monitor.alsa.rules = [
    {
        matches = [
            {
                alsa.id = "~t2-.*"
                node.name = "~alsa_output.*.HiFi__Speaker__sink"
            }
        ]
        actions = {
            update-props = {
                audio.allowed-rates = [96000, 88200, 48000, 44100]
                node.name = "alsa_output.platform-sound.RawSpeakers"
                node.description = "Raw Speaker Device (do not use)"
                node.nick = "RawSpeakers"
            }
        }
    }
    {
        matches = [
            {
                alsa.id = "~t2-.*"
                node.name = "~alsa_input.*.HiFi__Mic__source"
            }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.platform-sound.RawMics"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMics"
            }
        }
    }
]

node.software-dsp.rules = [
    {
        matches = [
            { alsa.id = "t2-15_1", node.name = "alsa_output.platform-sound.RawSpeakers" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2linux-audio/15_1/graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { alsa.id = "t2-15_1", node.name = "alsa_input.platform-sound.RawMics" }
