# WirePlumber configuration for T2 MacBook Pro 15,1 DSP
# Stable raw device names (Asahi-style) + node.software-dsp filter chains

monitor.alsa.rules = [
    {
        matches = [
            {
                api.alsa.card.name = "Apple T2 Audio"
                node.name = "~alsa_output.pci.*.HiFi__Speaker__sink"
                media.class = "Audio/Sink"
            }
        ]
        actions = {
            update-props = {
                audio.allowed-rates = [48000, 44100]
                node.name = "alsa_output.platform-sound.RawSpeakers"
                node.description = "Raw Speaker Device (do not use)"
                node.nick = "RawSpeakers"
            }
        }
    }
    {
        matches = [
            {
                api.alsa.card.name = "Apple T2 Audio"
                node.name = "~alsa_input.pci.*.HiFi__Mic__source"
                media.class = "Audio/Source"
            }
        ]
        actions = {
            update-props = {
                node.name = "alsa_input.platform-sound.RawMics"
                node.description = "Raw Mic Device (do not use)"
                node.nick = "RawMics"
            }
        }
    }
]

node.software-dsp.rules = [
    {
        matches = [
            { node.name = "alsa_output.platform-sound.RawSpeakers" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2-linux-audio/15_1/graph.json"
                hide-parent = true
            }
        }
    }
    {
        matches = [
            { node.name = "alsa_input.platform-sound.RawMics" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/t2-linux-audio/15_1/mic.json"
                hide-parent = true
            }
        }
    }
]

wireplumber.components = [
    {
        name = /usr/share/t2-linux-audio/15_1/t2-force-unmute.lua, type = script/lua,
        provides = custom.t2-audio
    }
]

wireplumber.profiles = {
    main = {
        node.software-dsp = required
        custom.t2-audio = required
    }
}
